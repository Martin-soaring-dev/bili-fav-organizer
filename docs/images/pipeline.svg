<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 508" role="img" aria-labelledby="title description">
  <title id="title">业务流水线</title>
  <desc id="description">连接、扫描与画像之后分为内容整理和收藏夹合并，两条路径都需要人工复核后确认写入。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#0F766E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>text { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }</style>
  </defs>
  <rect x="0.5" y="0.5" width="679" height="507" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="28" y="35" font-size="16" font-weight="600" fill="#0F3D3A">业务流水线 · 快速模式可自动跑到「人工复核」节点</text>
  <text x="28" y="59" font-size="13" font-weight="400" fill="#475569">手动模式可逐步执行；两种模式最终写操作都必须人工确认</text>
  <rect x="114" y="88" width="254" height="62" rx="8" fill="#0F766E"/>
  <text x="134" y="113" font-size="15" font-weight="600" fill="#FFFFFF">🔌 连接配置</text>
  <text x="134" y="135" font-size="13" font-weight="400" fill="#CCFBF1">扫码 Cookie + 激活模型</text>
  <rect x="114" y="178" width="254" height="62" rx="8" fill="#14B8A6"/>
  <text x="134" y="203" font-size="15" font-weight="600" fill="#0F3D3A">🔍 获取收藏明细</text>
  <text x="134" y="225" font-size="13" font-weight="400" fill="#0F3D3A">刷新目录 → 扫描（补齐式）</text>
  <rect x="114" y="268" width="254" height="62" rx="8" fill="#2DD4BF"/>
  <text x="134" y="293" font-size="15" font-weight="600" fill="#0F3D3A">🧭 收藏夹画像</text>
  <text x="134" y="315" font-size="13" font-weight="400" fill="#0F3D3A">全选 → 生成缺失 / 过期画像</text>
  <path d="M241 150 V172" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M241 240 V262" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M241 330 V357" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M135 357 H367" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M135 357 V379" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M367 357 V379" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="28" y="387" width="214" height="93" rx="8" fill="#F0FDFA" stroke="#14B8A6"/>
  <text x="46" y="413" font-size="14" font-weight="600" fill="#1E293B">🤖 LLM 归类分析</text>
  <text x="46" y="438" font-size="13" font-weight="400" fill="#475569">加载预归类方案</text>
  <text x="46" y="459" font-size="13" font-weight="400" fill="#475569">逐条人工复核</text>
  <rect x="260" y="387" width="214" height="93" rx="8" fill="#F0FDFA" stroke="#14B8A6"/>
  <text x="278" y="413" font-size="14" font-weight="600" fill="#1E293B">🗂 生成 AI 合并建议</text>
  <text x="278" y="438" font-size="13" font-weight="400" fill="#475569">编辑合并组</text>
  <text x="278" y="459" font-size="13" font-weight="400" fill="#475569">人工复核后提交</text>
  <rect x="488" y="88" width="164" height="392" rx="10" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="570" y="115" font-size="14" font-weight="600" fill="#B45309" text-anchor="middle">安全与规则</text>
  <rect x="501" y="130" width="138" height="74" rx="8" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="570" y="152" font-size="13" font-weight="500" fill="#1E293B" text-anchor="middle">默认夹 = 收件箱</text>
  <text x="570" y="174" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">只移出、不移入</text>
  <text x="570" y="192" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">不生成画像</text>
  <rect x="501" y="214" width="138" height="74" rx="8" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="570" y="236" font-size="13" font-weight="500" fill="#1E293B" text-anchor="middle">画像完整性门槛</text>
  <text x="570" y="258" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">有内容的 active 夹</text>
  <text x="570" y="276" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">须有当前完整画像</text>
  <rect x="501" y="298" width="138" height="74" rx="8" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="570" y="320" font-size="13" font-weight="500" fill="#1E293B" text-anchor="middle">执行原则</text>
  <text x="570" y="342" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">先进目标夹</text>
  <text x="570" y="360" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">成功后再删原夹</text>
  <rect x="501" y="382" width="138" height="74" rx="8" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="570" y="404" font-size="13" font-weight="500" fill="#1E293B" text-anchor="middle">停在人工复核前</text>
  <text x="570" y="426" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">不自动提交</text>
  <text x="570" y="444" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">不自动写回</text>
</svg>
