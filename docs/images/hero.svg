  <text x="202.0" y="204" font-size="12" font-weight="500" fill="#0F766E" text-anchor="middle">快速模式</text>
  <rect x="264" y="185" width="110" height="28" rx="14" fill="#FFFFFF" stroke="#5EEAD4"/>
  <text x="319.0" y="204" font-size="12" font-weight="500" fill="#0F766E" text-anchor="middle">默认夹收件箱</text>
