  <text x="105.0" y="149" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">扫描 · 断点续扫</text>
  <rect x="206" y="108" width="130" height="52" rx="8" fill="#14B8A6"/>
  <text x="271.0" y="129" font-size="12.5" font-weight="600" fill="#0F3D3A" text-anchor="middle">🤖 LLM 归类</text>
  <text x="271.0" y="149" font-size="12" font-weight="400" fill="#0F3D3A" text-anchor="middle">画像驱动</text>
  <rect x="372" y="108" width="130" height="52" rx="8" fill="#2DD4BF"/>
  <text x="437.0" y="129" font-size="12.5" font-weight="600" fill="#0F3D3A" text-anchor="middle">📊 预归类方案</text>
  <text x="437.0" y="149" font-size="12" font-weight="400" fill="#0F3D3A" text-anchor="middle">逐条人工复核</text>
  <rect x="538" y="108" width="110" height="52" rx="8" fill="#99F6E4"/>
  <text x="593.0" y="129" font-size="12.5" font-weight="600" fill="#0F3D3A" text-anchor="middle">🚀 确认执行</text>
  <text x="593.0" y="149" font-size="12" font-weight="400" fill="#0F3D3A" text-anchor="middle">先加后删</text>
  <path d="M178 134 H198" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M344 134 H364" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M510 134 H530" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="40" y="185" width="100" height="28" rx="14" fill="#FFFFFF" stroke="#5EEAD4"/>
