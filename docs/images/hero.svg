<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" role="img" aria-labelledby="title description">
  <title id="title">B站收藏夹智能整理</title>
  <desc id="description">本地运行的收藏夹整理工具，经过扫描、归类和人工复核后才确认执行。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#0F766E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>text { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }</style>
  </defs>
  <rect x="0.5" y="0.5" width="679" height="239" rx="16" fill="#F0FDFA" stroke="#99F6E4"/>
  <circle cx="52" cy="42" r="18" fill="#CCFBF1"/>
  <circle cx="78" cy="34" r="10" fill="#5EEAD4"/>
  <path d="M42 58 C42 40, 70 40, 70 58" fill="#0F766E"/>
  <text x="110" y="48" font-size="22" font-weight="700" fill="#0F3D3A">B站收藏夹智能整理</text>
  <text x="110" y="74" font-size="13" font-weight="400" fill="#1E293B">用 LLM 按内容归类收藏 · 本地运行 · 人工复核后才写回 B 站</text>
  <rect x="40" y="108" width="130" height="52" rx="8" fill="#0F766E"/>
