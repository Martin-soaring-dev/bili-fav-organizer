name: Modular architecture checks

on:
  push:
    branches:
      - feat/modular-architecture-task-manager
  pull_request:
    paths:
      - 'bili_fav/**'
      - 'tests/test_task_manager.py'
      - 'tests/test_sqlite_task_journal.py'
      - 'tests/test_task_api.py'
      - 'tests/test_task_bridge.py'
      - 'tests/test_api_registry.py'
      - 'bili_fav/api/**'
      - 'server.py'
      - '.github/workflows/modular-architecture-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-runtime:
    name: Task runtime / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest fastapi httpx
      - name: Run isolated task tests
        run: python -m pytest -q tests/test_task_manager.py tests/test_sqlite_task_journal.py tests/test_task_api.py tests/test_task_bridge.py tests/test_api_registry.py
      - name: Compile modular backend
        run: python -m compileall -q bili_fav
