name: CI

# 代码质量门禁：主分支与每个 PR 都跑一遍测试。
# 发布构建另由 main 上手动触发的 build-only 工作流负责；发布在独立受保护流程中进行。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # 必须跑在 Windows 上：测试覆盖 DPAPI/设备密钥、注册表安装标记、
    # 路径与 PowerShell 相关行为，这些只在 Windows 下成立。
    runs-on: windows-latest
    env:
      BFO_REQUIRE_PLAYWRIGHT: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Install Chromium for required UI regressions
        run: python -m playwright install chromium

      # 与 requirements.txt 注释里给贡献者的命令保持一致
      - name: Run tests
        run: python tools/run_isolated_tests.py
