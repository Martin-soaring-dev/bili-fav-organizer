name: Beta packaging validation

on:
  pull_request:
    paths:
      - '.github/workflows/release-beta.yml'
      - '.github/workflows/release-stable.yml'
      - '.github/workflows/publish-release.yml'
      - '.github/workflows/ci-beta-package.yml'
      - 'tools/release_candidate.py'
      - 'tests/test_release_candidate.py'
      - 'tests/test_release_workflow_contract.py'
      - 'electron/**'
      - 'electron-builder.yml'
      - 'package*.json'
      - 'store.py'
      - 'core/**'
      - 'server.py'
      - 'vault.py'
      - 'static/**'
      - 'tests/**'
      - 'tools/**'
      - 'BiliFavOrganizer.spec'
      - 'requirements*.txt'
      - 'packaging/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    env:
      BFO_REQUIRE_PLAYWRIGHT: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements-test.txt pyinstaller
      - name: Install Chromium for required UI regressions
        run: python -m playwright install chromium
      - name: Run Python regression suite
        run: python tools/run_isolated_tests.py
      - name: Build frozen backend
        run: pyinstaller --noconfirm --clean BiliFavOrganizer.spec
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run Electron external-link unit tests
        run: node --test tests/electron_external_links.test.js
      - name: Build Electron neo NSIS installer (not published)
        shell: pwsh
        run: |
          npx electron-builder --config electron-builder.yml --win nsis --x64 --publish never "-c.extraMetadata.version=0.209.0-beta.2"
          if ($LASTEXITCODE -ne 0) { throw "Electron builder failed" }
          if (-not (Test-Path "dist/electron/BiliFavOrganizer-neo-Setup-0.209.0-beta.2.exe")) {
            throw "Expected beta installer missing"
          }
      - name: Inspect installer artifact
        shell: pwsh
        run: |
          $path = "dist/electron/BiliFavOrganizer-neo-Setup-0.209.0-beta.2.exe"
          Get-Item $path | Select-Object FullName, Length
          Get-FileHash $path -Algorithm SHA256
      - name: Smoke test unpacked Electron renderer and backend
        shell: pwsh
        run: |
          $workspace = ".bfo-package-smoke-ci"
          $target = Join-Path $workspace "checkout/dist/electron/win-unpacked"
          New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
          Copy-Item -Path "dist/electron/win-unpacked" -Destination (Split-Path $target) -Recurse -Force
          python tools/run_isolated_packaged_smoke.py $workspace --profile-name launch-profile-ci
          if ($LASTEXITCODE -ne 0) { throw "Packaged Electron smoke failed" }
      - name: Remove isolated Electron smoke workspace
        if: always()
        shell: pwsh
        run: |
          Remove-Item ".bfo-package-smoke-ci" -Recurse -Force -ErrorAction SilentlyContinue

