name: Build Windows portable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application and packager dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build self-contained application
        run: pyinstaller --noconfirm --clean BiliFavOrganizer.spec

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $releaseDir = "dist/BiliFavOrganizer"
          if (-not (Test-Path "$releaseDir/BiliFavOrganizer.exe")) { throw "Portable executable was not built." }
          foreach ($name in @("config.json", "secrets.json", "data", "server.log", "write_operations.jsonl")) {
            if (Test-Path (Join-Path $releaseDir $name)) { throw "Refusing to package local/private data: $name" }
          }
          Copy-Item "启动.bat" "$releaseDir/启动.bat"
          Copy-Item "packaging/使用说明.txt" "$releaseDir/使用说明.txt"
          $zip = "BiliFavOrganizer-Windows-x64.zip"
          Compress-Archive -Path "$releaseDir/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content "$zip.sha256" -Encoding ascii

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "BiliFavOrganizer-Windows-x64.zip" "BiliFavOrganizer-Windows-x64.zip.sha256" --clobber
          } else {
            gh release create $tag "BiliFavOrganizer-Windows-x64.zip" "BiliFavOrganizer-Windows-x64.zip.sha256" --generate-notes
          }
