name: Temporary wheelhouse for isolated G0 Linux audit

on:
  pull_request:
    paths:
      - '.github/workflows/ci-g0-dependency-audit.yml'

permissions:
  contents: read

jobs:
  g0-dependency-wheelhouse:
    if: ${{ github.event.pull_request.head.ref == 'ci/ea-playwright-full-regression-20261019' }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download isolated-test dependencies, no user data
        shell: bash
        run: |
          set -euo pipefail
          python -m pip wheel --wheel-dir "$RUNNER_TEMP/wheelhouse" pycryptodomex==3.23.0 browsercookie==0.8.2 httpx2
          ls -lh "$RUNNER_TEMP/wheelhouse"
      - name: Upload short-lived dependency wheels
        uses: actions/upload-artifact@v4
        with:
          name: bfo-g0-isolated-test-deps-20261019
          path: ${{ runner.temp }}/wheelhouse/
          if-no-files-found: error
          retention-days: 1
